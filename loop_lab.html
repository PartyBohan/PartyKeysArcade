<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop Lab</title>
<style>
:root {
    --bg1: #0a0a1a;
    --bg2: #0d1b2a;
    --bg3: #111827;
    --accent: #00f5d4;
    --danger: #ff6b6b;
    --text: #e0e0e0;
    --text-dim: #888;
    --card-bg: rgba(255,255,255,0.05);
    --track1: #ff6b6b;
    --track2: #60a5fa;
    --track3: #fbbf24;
    --track4: #34d399;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg1);
    background-image:
        radial-gradient(ellipse at 20% 50%, rgba(0,245,212,0.03) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(167,139,250,0.03) 0%, transparent 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
}

#app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 20px 20px;
}

/* ===== HEADER ===== */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 14px;
}
.header-left {
    display: flex;
    align-items: baseline;
    gap: 12px;
}
.header h1 {
    font-size: 30px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
}
.header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
}
.midi-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    padding: 5px 12px;
    background: var(--card-bg);
    border-radius: 20px;
}
.midi-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s, box-shadow 0.3s;
}
.midi-dot.connected {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
}

/* ===== TRANSPORT ===== */
.transport {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: var(--bg2);
    border-radius: 14px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    border: 1px solid rgba(255,255,255,0.04);
}
.transport-group {
    display: flex;
    align-items: center;
    gap: 8px;
}
.transport-group label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
}

.btn {
    padding: 6px 14px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    color: #ccc;
    background: rgba(255,255,255,0.08);
    outline: none;
}
.btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn.active { background: var(--accent); color: #000; box-shadow: 0 0 12px rgba(0,245,212,0.3); }
.btn.play-btn { min-width: 80px; }
.btn.play-btn.active { background: var(--accent); color: #000; }
.btn.metro-btn.active { background: var(--accent); color: #000; }

.bpm-control {
    display: flex;
    align-items: center;
    gap: 6px;
}
.bpm-control input[type="range"] {
    width: 80px;
    accent-color: var(--accent);
    height: 4px;
}
.bpm-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    min-width: 38px;
    text-align: center;
    font-variant-numeric: tabular-nums;
}

.loop-btns, .quant-btns {
    display: flex;
    gap: 3px;
}
.loop-btns .btn, .quant-btns .btn {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 6px;
    min-width: 32px;
    text-align: center;
}

.sep {
    width: 1px;
    height: 26px;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
}

/* ===== BEAT INDICATOR ===== */
.beat-indicator {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 5px 0 8px;
}
.beat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    transition: all 0.08s ease;
}
.beat-dot.on-beat {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transform: scale(1.3);
}
.beat-dot.on-bar {
    background: #fff;
    box-shadow: 0 0 12px rgba(255,255,255,0.6);
    transform: scale(1.5);
}

/* ===== TRACKS ===== */
.tracks-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
}

.track-lane {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--card-bg);
    border-radius: 12px;
    border: 2px solid transparent;
    transition: border-color 0.25s, box-shadow 0.25s;
    position: relative;
    cursor: pointer;
}
.track-lane.selected {
    border-color: rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
}
.track-lane.recording {
    animation: rec-pulse 0.7s ease-in-out infinite alternate;
}

@keyframes rec-pulse {
    0% { box-shadow: inset 0 0 0px 0px transparent; }
    100% { box-shadow: inset 0 0 25px -8px var(--track-color); }
}

.track-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 50px;
}
.track-color-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    box-shadow: 0 0 6px var(--track-color);
}
.track-name {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.track-note-count {
    font-size: 9px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
}

/* Track canvas */
.track-canvas-wrap {
    flex: 1;
    height: 56px;
    background: rgba(0,0,0,0.35);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}
.track-canvas-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* Track controls */
.track-controls {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}
.track-controls .btn {
    padding: 4px 9px;
    font-size: 10px;
    border-radius: 6px;
    min-width: 34px;
    text-align: center;
    font-weight: 700;
}
.btn.rec-btn {
    background: rgba(255,60,60,0.2);
    color: #ff8888;
    letter-spacing: 0.5px;
}
.btn.rec-btn.active {
    background: #ee3333;
    color: #fff;
    animation: rec-glow 0.5s ease-in-out infinite alternate;
}
@keyframes rec-glow {
    0% { box-shadow: 0 0 4px #ee3333; }
    100% { box-shadow: 0 0 14px #ee3333, 0 0 28px rgba(238,51,51,0.25); }
}
.btn.mute-btn { color: #f59e0b; }
.btn.mute-btn.active { background: #f59e0b; color: #000; }
.btn.solo-btn { color: #8b5cf6; }
.btn.solo-btn.active { background: #8b5cf6; color: #fff; }
.btn.erase-btn { color: #ff8888; }
.btn.erase-btn:hover { background: rgba(255,100,100,0.2); }

.vol-slider {
    width: 46px;
    accent-color: var(--accent);
    height: 3px;
}

/* ===== WAVEFORM DISPLAY ===== */
.waveform-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}
.waveform-box {
    flex: 1;
    height: 36px;
    background: var(--card-bg);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255,255,255,0.04);
}
.waveform-box canvas {
    width: 100%;
    height: 100%;
    display: block;
}
.waveform-label {
    position: absolute;
    top: 3px;
    left: 6px;
    font-size: 9px;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    pointer-events: none;
}

/* ===== VIRTUAL KEYBOARD ===== */
.keyboard-section {
    background: var(--bg2);
    border-radius: 12px;
    padding: 8px 14px 12px;
    border: 1px solid rgba(255,255,255,0.04);
}
.keyboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}
.keyboard-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
}
.keyboard-track-indicator {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    transition: all 0.2s;
}
.keyboard {
    display: flex;
    position: relative;
    height: 76px;
    user-select: none;
}
.white-key {
    flex: 1;
    background: linear-gradient(to bottom, #f0f0f0, #d8d8d8);
    border: 1px solid #888;
    border-top: none;
    border-radius: 0 0 5px 5px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    transition: background 0.06s, box-shadow 0.06s;
    min-width: 0;
}
.white-key:hover { background: linear-gradient(to bottom, #e0e0e0, #c8c8c8); }
.white-key.pressed {
    background: linear-gradient(to bottom, #bbb, #aaa);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
}
.white-key .key-label {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 7px;
    color: #888;
    pointer-events: none;
    font-weight: 600;
}
.black-key {
    height: 48px;
    background: linear-gradient(to bottom, #333, #111);
    border: 1px solid #000;
    border-top: none;
    border-radius: 0 0 3px 3px;
    position: absolute;
    z-index: 2;
    cursor: pointer;
    transition: background 0.06s;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
}
.black-key:hover { background: linear-gradient(to bottom, #444, #222); }
.black-key.pressed {
    background: linear-gradient(to bottom, #555, #333);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    height: 47px;
}

/* ===== SHORTCUTS HINT ===== */
.shortcuts-hint {
    display: flex;
    gap: 14px;
    justify-content: center;
    padding: 8px 0 4px;
    flex-wrap: wrap;
}
.shortcuts-hint span {
    font-size: 10px;
    color: #444;
}
.shortcuts-hint kbd {
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9px;
    color: #666;
    margin-right: 2px;
    border: 1px solid rgba(255,255,255,0.06);
}

/* ===== UNDO BUTTON ===== */
.btn.undo-btn {
    background: rgba(167, 139, 250, 0.15);
    color: #a78bfa;
}
.btn.undo-btn:hover { background: rgba(167, 139, 250, 0.28); }

/* ===== SCROLLBAR STYLING ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

/* ===== RECORDING COUNTDOWN ===== */
.rec-countdown {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: 800;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    z-index: 10;
}
.rec-countdown.visible {
    opacity: 1;
    animation: countdown-pop 0.3s ease-out;
}
@keyframes countdown-pop {
    0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* ===== STATUS BAR ===== */
.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 10px;
    color: #444;
}
.status-bar .status-left { display: flex; gap: 16px; }
.status-bar .status-right { display: flex; gap: 16px; }
.status-item { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="app">

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <h1>Loop Lab</h1>
            <span class="subtitle">Four-track live looper</span>
        </div>
        <div class="midi-status">
            <div class="midi-dot" id="midiDot"></div>
            <span id="midiText">No MIDI device</span>
        </div>
    </div>

    <!-- Transport -->
    <div class="transport">
        <div class="transport-group">
            <button class="btn play-btn" id="playBtn" onclick="togglePlay()">&#9654; Play</button>
            <button class="btn metro-btn" id="metroBtn" onclick="toggleMetro()">Metro</button>
            <button class="btn undo-btn" id="undoBtn" onclick="undoLast()">Undo</button>
        </div>
        <div class="sep"></div>
        <div class="transport-group">
            <label>BPM</label>
            <div class="bpm-control">
                <input type="range" min="60" max="180" value="120" id="bpmSlider" oninput="setBPM(this.value)">
                <span class="bpm-val" id="bpmVal">120</span>
            </div>
        </div>
        <div class="sep"></div>
        <div class="transport-group">
            <label>Bars</label>
            <div class="loop-btns" id="loopBtns">
                <button class="btn active" data-bars="1" onclick="setLoopBars(1,this)">1</button>
                <button class="btn" data-bars="2" onclick="setLoopBars(2,this)">2</button>
                <button class="btn" data-bars="4" onclick="setLoopBars(4,this)">4</button>
            </div>
        </div>
        <div class="sep"></div>
        <div class="transport-group">
            <label>Grid</label>
            <div class="quant-btns" id="quantBtns">
                <button class="btn" data-q="1" onclick="setQuantize(1,this)">1/4</button>
                <button class="btn active" data-q="0.5" onclick="setQuantize(0.5,this)">1/8</button>
                <button class="btn" data-q="0.25" onclick="setQuantize(0.25,this)">1/16</button>
            </div>
        </div>
    </div>

    <!-- Beat dots -->
    <div class="beat-indicator" id="beatIndicator"></div>

    <!-- Waveform row -->
    <div class="waveform-row" id="waveformRow">
        <div class="waveform-box" id="wfBox0"><span class="waveform-label">Bass</span><canvas id="wfCanvas0"></canvas></div>
        <div class="waveform-box" id="wfBox1"><span class="waveform-label">Pad</span><canvas id="wfCanvas1"></canvas></div>
        <div class="waveform-box" id="wfBox2"><span class="waveform-label">Lead</span><canvas id="wfCanvas2"></canvas></div>
        <div class="waveform-box" id="wfBox3"><span class="waveform-label">Keys</span><canvas id="wfCanvas3"></canvas></div>
    </div>

    <!-- Track lanes -->
    <div class="tracks-container" id="tracksContainer"></div>

    <!-- Status bar -->
    <div class="status-bar">
        <div class="status-left">
            <span class="status-item" id="statusPos">Bar 1 : Beat 1</span>
            <span class="status-item" id="statusLoop">Loop: 4 beats</span>
        </div>
        <div class="status-right">
            <span class="status-item" id="statusNotes">Total notes: 0</span>
            <span class="status-item" id="statusRec">Ready</span>
        </div>
    </div>

    <!-- Virtual keyboard -->
    <div class="keyboard-section">
        <div class="keyboard-header">
            <span class="keyboard-label">Virtual Keyboard (C3 - B5)</span>
            <span class="keyboard-track-indicator" id="kbTrackLabel">Bass</span>
        </div>
        <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- Shortcuts -->
    <div class="shortcuts-hint">
        <span><kbd>Space</kbd> Play/Stop</span>
        <span><kbd>1-4</kbd> Track</span>
        <span><kbd>R</kbd> Record</span>
        <span><kbd>M</kbd> Mute</span>
        <span><kbd>S</kbd> Solo</span>
        <span><kbd>E</kbd> Erase</span>
        <span><kbd>Z</kbd> Undo</span>
        <span><kbd>Esc</kbd> Stop All</span>
    </div>
</div>

<script>
// ═══ PartyKeys SysEx LED Protocol ═══
const PK_SYSEX_INIT = [0xF0,0x05,0x30,0x7F,0x7F,0x20,0x00,0x0F,0x05,0xF7];
const PK_SYSEX_HEAD = [0xF0,0x05,0x30,0x7F,0x7F,0x20,0x00,0x71];
const PK_SYSEX_ALLOFF = [0xF0,0x05,0x30,0x7F,0x7F,0x20,0x00,0x71,0x00,0xF7];
let _pkLedReady = false;
function _pkLedInit(output){
    if(!_pkLedReady && output){ output.send(PK_SYSEX_INIT); _pkLedReady = true; }
}
function _pkSendLed(output, noteColorPairs){
    if(!output || noteColorPairs.length === 0) return;
    _pkLedInit(output);
    const msg = [...PK_SYSEX_HEAD, noteColorPairs.length];
    noteColorPairs.forEach(([n, c]) => { msg.push(n, c); });
    msg.push(0xF7);
    output.send(msg);
}
function _pkSendOne(output, note, color){
    if(!output) return;
    _pkLedInit(output);
    output.send([...PK_SYSEX_HEAD, 0x01, note, color, 0xF7]);
}
function _pkAllOff(output){
    if(!output) return;
    output.send(PK_SYSEX_ALLOFF);
}

// ============================================================
//  LOOP LAB - Four-track live looper
// ============================================================

// ===== AUDIO CONTEXT & BUSES =====
let audioCtx = null;
let masterGain, bgmGain, sfxGain, keysGain;
let analyserNodes = [null, null, null, null];
let trackGainNodes = [null, null, null, null];

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.85;
    masterGain.connect(audioCtx.destination);

    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0.5;
    bgmGain.connect(masterGain);

    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.5;
    sfxGain.connect(masterGain);

    keysGain = audioCtx.createGain();
    keysGain.gain.value = 0.5;
    keysGain.connect(masterGain);

    // Per-track gain + analyser for waveform display
    for (let i = 0; i < 4; i++) {
        trackGainNodes[i] = audioCtx.createGain();
        trackGainNodes[i].gain.value = 0.7;
        trackGainNodes[i].connect(bgmGain);

        analyserNodes[i] = audioCtx.createAnalyser();
        analyserNodes[i].fftSize = 256;
        trackGainNodes[i].connect(analyserNodes[i]);
    }
}

// ===== CONSTANTS =====
const TRACK_COLORS = ['#ff6b6b', '#60a5fa', '#fbbf24', '#34d399'];
const TRACK_COLORS_DIM = ['rgba(255,107,107,0.3)', 'rgba(96,165,250,0.3)', 'rgba(251,191,36,0.3)', 'rgba(52,211,153,0.3)'];
const TRACK_NAMES = ['Bass', 'Pad', 'Lead', 'Keys'];
const LED_COLORS = {off:0, red:0x01, green:0x07, blue:0x09, yellow:0x05, cyan:0x08, purple:0x0C, white:0x06};
const TRACK_LED = [LED_COLORS.red, LED_COLORS.blue, LED_COLORS.yellow, LED_COLORS.green];
const NOTE_MIN = 48, NOTE_MAX = 83;
const NOTE_RANGE = NOTE_MAX - NOTE_MIN + 1;

// ===== STATE =====
const state = {
    playing: false,
    bpm: 120,
    metronome: false,
    loopBars: 1,
    quantize: 0.5, // beats (0.25=16th, 0.5=8th, 1.0=quarter)
    selectedTrack: 0,
    recordingTrack: -1,
    recordStartBeat: -1,
    tracks: [
        { notes: [], muted: false, solo: false, volume: 0.7, undoNotes: null },
        { notes: [], muted: false, solo: false, volume: 0.7, undoNotes: null },
        { notes: [], muted: false, solo: false, volume: 0.7, undoNotes: null },
        { notes: [], muted: false, solo: false, volume: 0.7, undoNotes: null }
    ],
    startTime: 0,
    lastScheduledMetroBeat: -1,
    liveNotes: new Map(),   // note -> { nodes, gain, startTime, trackIdx, velocity, startBeat }
    playbackLEDs: new Set(),
    scheduledOscillators: [],
    recWaitingForBar: false, // true while counting in to next bar
};

// Dedup set for scheduled playback notes
const _scheduledSet = new Set();

// ===== MIDI =====
let midiOutput = null, midiInput = null;

async function initMIDI() {
    try {
        const access = await navigator.requestMIDIAccess({ sysex: true });
        access.onstatechange = () => scanMIDI(access);
        scanMIDI(access);
    } catch (e) { /* no MIDI */ }
}

function scanMIDI(access) {
    midiOutput = null; midiInput = null;
    for (const o of access.outputs.values()) { midiOutput = o; break; }
    for (const inp of access.inputs.values()) {
        midiInput = inp;
        inp.onmidimessage = onMIDIMessage;
        break;
    }
    const dot = document.getElementById('midiDot');
    const txt = document.getElementById('midiText');
    if (midiInput || midiOutput) {
        dot.classList.add('connected');
        txt.textContent = (midiInput || midiOutput).name;
    } else {
        dot.classList.remove('connected');
        txt.textContent = 'No MIDI device';
    }
}

function sendLED(note, color) {
    if (!midiOutput) return;
    try { _pkSendOne(midiOutput, note, color); } catch (e) {}
}

function clearAllLEDs() {
    if(midiOutput) _pkAllOff(midiOutput);
}

function onMIDIMessage(msg) {
    const [status, note, vel] = msg.data;
    const cmd = status & 0xF0;
    if (cmd === 0x90 && vel > 0) noteOn(note, vel);
    else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) noteOff(note);
}

// ===== SYNTH: per-track timbre =====
function midiToFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }

// -- Bass: sine + sub-octave, LP 400 Hz --
function synthBass(freq, vel, dur, dest) {
    const t = audioCtx.currentTime;
    const v = vel / 127;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filt = audioCtx.createBiquadFilter();
    osc1.type = 'sine'; osc1.frequency.value = freq;
    osc2.type = 'sine'; osc2.frequency.value = freq / 2;
    filt.type = 'lowpass'; filt.frequency.value = 400; filt.Q.value = 2;
    const g = v * 0.4;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(g, t + 0.04);
    gain.gain.setValueAtTime(g, t + Math.max(0, dur - 0.06));
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc1.connect(filt); osc2.connect(filt); filt.connect(gain); gain.connect(dest);
    osc1.start(t); osc2.start(t);
    osc1.stop(t + dur + 0.02); osc2.stop(t + dur + 0.02);
    return { nodes: [osc1, osc2], gain };
}

// -- Pad: detuned sines +/-5 cents, slow attack/release, LP 2000 Hz --
function synthPad(freq, vel, dur, dest) {
    const t = audioCtx.currentTime;
    const v = vel / 127;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filt = audioCtx.createBiquadFilter();
    osc1.type = 'sine'; osc1.frequency.value = freq * Math.pow(2, 5 / 1200);
    osc2.type = 'sine'; osc2.frequency.value = freq * Math.pow(2, -5 / 1200);
    filt.type = 'lowpass'; filt.frequency.value = 2000; filt.Q.value = 0.7;
    const g = v * 0.25;
    const atk = Math.min(0.18, dur * 0.3);
    const rel = Math.min(0.25, dur * 0.3);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(g, t + atk);
    gain.gain.setValueAtTime(g, t + Math.max(atk, dur - rel));
    gain.gain.linearRampToValueAtTime(0, t + dur + rel * 0.5);
    osc1.connect(filt); osc2.connect(filt); filt.connect(gain); gain.connect(dest);
    osc1.start(t); osc2.start(t);
    const end = t + dur + rel + 0.05;
    osc1.stop(end); osc2.stop(end);
    return { nodes: [osc1, osc2], gain };
}

// -- Lead: triangle + 2nd harmonic, LP 5000 Hz --
function synthLead(freq, vel, dur, dest) {
    const t = audioCtx.currentTime;
    const v = vel / 127;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gOsc2 = audioCtx.createGain();
    const gain = audioCtx.createGain();
    const filt = audioCtx.createBiquadFilter();
    osc1.type = 'triangle'; osc1.frequency.value = freq;
    osc2.type = 'sine'; osc2.frequency.value = freq * 2;
    gOsc2.gain.value = 0.3;
    filt.type = 'lowpass'; filt.frequency.value = 5000; filt.Q.value = 1;
    const g = v * 0.3;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(g, t + 0.015);
    gain.gain.setValueAtTime(g, t + Math.max(0.02, dur - 0.08));
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc1.connect(filt); osc2.connect(gOsc2); gOsc2.connect(filt);
    filt.connect(gain); gain.connect(dest);
    osc1.start(t); osc2.start(t);
    osc1.stop(t + dur + 0.02); osc2.stop(t + dur + 0.02);
    return { nodes: [osc1, osc2], gain };
}

// -- Keys: 5-partial piano-style, LP sweep --
function synthKeys(freq, vel, dur, dest) {
    const t = audioCtx.currentTime;
    const v = vel / 127;
    const partials = [1, 2, 3, 4, 6];
    const amps    = [1, 0.5, 0.22, 0.1, 0.05];
    const decays  = [2.2, 1.3, 0.85, 0.5, 0.3];
    const mGain = audioCtx.createGain();
    mGain.gain.value = v * 0.22;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(3500 + v * 5000, t);
    filt.frequency.exponentialRampToValueAtTime(700, t + Math.min(dur, 2));
    filt.Q.value = 0.5;
    filt.connect(mGain); mGain.connect(dest);
    const nodes = [];
    for (let i = 0; i < partials.length; i++) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq * partials[i];
        const a = amps[i], d = Math.min(decays[i], dur);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(a, t + 0.004);
        g.gain.exponentialRampToValueAtTime(a * 0.008 + 0.001, t + d);
        g.gain.linearRampToValueAtTime(0, t + dur + 0.05);
        osc.connect(g); g.connect(filt);
        osc.start(t); osc.stop(t + dur + 0.1);
        nodes.push(osc);
    }
    return { nodes, gain: mGain };
}

function playSynth(trackIdx, freq, vel, dur, dest) {
    switch (trackIdx) {
        case 0: return synthBass(freq, vel, dur, dest);
        case 1: return synthPad(freq, vel, dur, dest);
        case 2: return synthLead(freq, vel, dur, dest);
        case 3: return synthKeys(freq, vel, dur, dest);
    }
}

// Metronome click
function playMetroClick(accent) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = accent ? 1200 : 800;
    g.gain.setValueAtTime(accent ? 0.28 : 0.14, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc.connect(g); g.connect(sfxGain);
    osc.start(t); osc.stop(t + 0.06);
}

// ===== LIVE PLAY: noteOn / noteOff =====
function noteOn(note, velocity) {
    initAudio();
    if (note < NOTE_MIN || note > NOTE_MAX) return;

    // Stop previous if still held
    if (state.liveNotes.has(note)) noteOff(note);

    const ti = state.selectedTrack;
    const freq = midiToFreq(note);
    const maxDur = 4; // max sustain seconds for live note
    const dest = keysGain;
    const result = playSynth(ti, freq, velocity, maxDur, dest);

    state.liveNotes.set(note, {
        nodes: result.nodes,
        gain: result.gain,
        startTime: audioCtx.currentTime,
        trackIdx: ti,
        velocity,
        startBeat: state.playing ? getCurrentBeat() : 0
    });

    sendLED(note, TRACK_LED[ti]);
    highlightKey(note, true, TRACK_COLORS[ti]);
}

function noteOff(note) {
    if (note < NOTE_MIN || note > NOTE_MAX) return;
    const live = state.liveNotes.get(note);
    if (!live) return;

    const now = audioCtx.currentTime;
    const elapsedSec = now - live.startTime;

    // Fade out live sound
    try {
        live.gain.gain.cancelScheduledValues(now);
        live.gain.gain.setValueAtTime(live.gain.gain.value, now);
        live.gain.gain.linearRampToValueAtTime(0, now + 0.04);
        live.nodes.forEach(n => { try { n.stop(now + 0.05); } catch (e) {} });
    } catch (e) {}

    // Record note if we are recording this track
    if (state.recordingTrack >= 0 && state.playing && live.trackIdx === state.recordingTrack && !state.recWaitingForBar) {
        const loopLen = state.loopBars * 4;
        const beatsPerSec = state.bpm / 60;
        let startBeat = live.startBeat % loopLen;
        let durBeats = elapsedSec * beatsPerSec;

        // Quantize start and duration
        startBeat = quantize(startBeat, state.quantize);
        durBeats = Math.max(quantize(durBeats, state.quantize), state.quantize);
        if (startBeat >= loopLen) startBeat = loopLen - state.quantize;
        if (startBeat + durBeats > loopLen) durBeats = loopLen - startBeat;
        if (durBeats <= 0) durBeats = state.quantize;

        state.tracks[state.recordingTrack].notes.push({
            note, time: startBeat, duration: durBeats, velocity: live.velocity
        });
    }

    state.liveNotes.delete(note);

    // Restore LED state
    if (!state.playbackLEDs.has(note)) {
        sendLED(note, 0);
    }
    highlightKey(note, false);
}

function quantize(val, grid) {
    return Math.round(val / grid) * grid;
}

// ===== TRANSPORT =====
function togglePlay() {
    initAudio();
    state.playing ? stopPlayback() : startPlayback();
}

function startPlayback() {
    state.playing = true;
    state.startTime = audioCtx.currentTime;
    state.lastScheduledMetroBeat = -1;
    _scheduledSet.clear();
    state.scheduledOscillators.forEach(n => { try { n.stop(); } catch (e) {} });
    state.scheduledOscillators = [];
    updatePlayBtn();
    tick();
}

function stopPlayback() {
    state.playing = false;
    if (state.recordingTrack >= 0) stopRecording();
    state.scheduledOscillators.forEach(n => { try { n.stop(audioCtx.currentTime + 0.04); } catch (e) {} });
    state.scheduledOscillators = [];
    _scheduledSet.clear();
    clearAllLEDs();
    state.playbackLEDs.clear();
    updatePlayBtn();
}

function updatePlayBtn() {
    const btn = document.getElementById('playBtn');
    btn.classList.toggle('active', state.playing);
    btn.innerHTML = state.playing ? '&#9724; Stop' : '&#9654; Play';
}

function getCurrentBeat() {
    if (!state.playing || !audioCtx) return 0;
    return (audioCtx.currentTime - state.startTime) * (state.bpm / 60);
}

function getLoopBeat() {
    const L = state.loopBars * 4;
    return ((getCurrentBeat() % L) + L) % L;
}

// ===== MAIN TICK (requestAnimationFrame-based scheduler) =====
const LOOK_AHEAD_SEC = 0.12;

function tick() {
    if (!state.playing) return;

    const now = audioCtx.currentTime;
    const bps = state.bpm / 60;
    const loopLen = state.loopBars * 4;
    const curBeat = getCurrentBeat();
    const lookAheadBeats = LOOK_AHEAD_SEC * bps;

    // --- Schedule track playback notes ---
    const hasSolo = state.tracks.some(t => t.solo);
    for (let ti = 0; ti < 4; ti++) {
        const track = state.tracks[ti];
        if (track.muted || (hasSolo && !track.solo) || track.notes.length === 0) continue;

        const loopIter = Math.floor(curBeat / loopLen);
        for (const nd of track.notes) {
            for (let off = 0; off <= 1; off++) {
                const absBeat = (loopIter + off) * loopLen + nd.time;
                if (absBeat >= curBeat && absBeat < curBeat + lookAheadBeats) {
                    schedulePlaybackNote(ti, nd, absBeat);
                }
            }
        }
    }

    // --- Schedule metronome ---
    if (state.metronome) {
        const fromBeat = Math.floor(curBeat);
        for (let b = fromBeat; b < curBeat + lookAheadBeats; b++) {
            if (b <= state.lastScheduledMetroBeat) continue;
            state.lastScheduledMetroBeat = b;
            const when = state.startTime + b / bps;
            const delay = Math.max(0, when - now);
            const accent = (b % 4) === 0;
            setTimeout(() => {
                if (!state.playing || !state.metronome) return;
                playMetroClick(accent);
                sendLED(60, LED_COLORS.white);
                setTimeout(() => {
                    if (!state.playbackLEDs.has(60) && !state.liveNotes.has(60)) sendLED(60, 0);
                }, 70);
            }, delay * 1000);
        }
    }

    // --- Check recording auto-stop ---
    if (state.recordingTrack >= 0 && state.recordStartBeat >= 0 && !state.recWaitingForBar) {
        if (curBeat - state.recordStartBeat >= loopLen) {
            stopRecording();
        }
    }

    // --- Check count-in complete ---
    if (state.recWaitingForBar && state.recordingTrack >= 0) {
        if (curBeat >= state.recordStartBeat) {
            state.recWaitingForBar = false;
        }
    }

    requestAnimationFrame(tick);
}

function schedulePlaybackNote(trackIdx, nd, absBeat) {
    const key = `${trackIdx}:${nd.note}:${nd.time}:${Math.floor(absBeat / (state.loopBars * 4))}`;
    if (_scheduledSet.has(key)) return;
    _scheduledSet.add(key);
    // Clean old entries periodically
    if (_scheduledSet.size > 500) {
        const arr = [..._scheduledSet];
        arr.splice(0, 300);
        _scheduledSet.clear();
        arr.forEach(k => _scheduledSet.add(k));
    }

    const now = audioCtx.currentTime;
    const bps = state.bpm / 60;
    const when = state.startTime + absBeat / bps;
    const delay = Math.max(0, when - now);
    const durSec = nd.duration / bps;

    setTimeout(() => {
        if (!state.playing) return;
        const hasSolo = state.tracks.some(t => t.solo);
        const track = state.tracks[trackIdx];
        if (track.muted || (hasSolo && !track.solo)) return;

        // Use per-track gain node
        const dest = trackGainNodes[trackIdx];
        if (!dest) return;
        dest.gain.value = track.volume;

        const freq = midiToFreq(nd.note);
        const result = playSynth(trackIdx, freq, nd.velocity, durSec, dest);
        if (result && result.nodes) state.scheduledOscillators.push(...result.nodes);

        // LED + keyboard highlight
        sendLED(nd.note, TRACK_LED[trackIdx]);
        state.playbackLEDs.add(nd.note);
        highlightKey(nd.note, true, TRACK_COLORS[trackIdx]);

        setTimeout(() => {
            state.playbackLEDs.delete(nd.note);
            if (!state.liveNotes.has(nd.note)) {
                sendLED(nd.note, 0);
                highlightKey(nd.note, false);
            }
        }, durSec * 1000);
    }, delay * 1000);
}

// ===== RECORDING =====
function toggleRecording(trackIdx) {
    initAudio();
    if (!state.playing) startPlayback();
    if (state.recordingTrack === trackIdx) {
        stopRecording();
    } else {
        if (state.recordingTrack >= 0) stopRecording();
        startRecording(trackIdx);
    }
}

function startRecording(trackIdx) {
    state.recordingTrack = trackIdx;
    state.selectedTrack = trackIdx;
    // Save undo state
    state.tracks[trackIdx].undoNotes = [...state.tracks[trackIdx].notes];

    // Count-in: wait for next bar boundary
    const curBeat = getCurrentBeat();
    const nextBar = Math.ceil(curBeat / 4) * 4;
    state.recordStartBeat = nextBar;
    state.recWaitingForBar = nextBar > curBeat + 0.05;

    startRecLEDPulse();
    updateTrackUI();
}

function stopRecording() {
    state.recordingTrack = -1;
    state.recordStartBeat = -1;
    state.recWaitingForBar = false;
    stopRecLEDPulse();
    updateTrackUI();
}

// Recording LED pulse
let _recLedTimer = null;
function startRecLEDPulse() {
    stopRecLEDPulse();
    let on = true;
    _recLedTimer = setInterval(() => {
        if (state.recordingTrack < 0) { stopRecLEDPulse(); return; }
        const color = on ? TRACK_LED[state.recordingTrack] : 0;
        for (let n = NOTE_MIN; n <= NOTE_MAX; n++) {
            if (!state.playbackLEDs.has(n) && !state.liveNotes.has(n)) sendLED(n, color);
        }
        on = !on;
    }, 350);
}
function stopRecLEDPulse() {
    if (_recLedTimer) { clearInterval(_recLedTimer); _recLedTimer = null; }
    for (let n = NOTE_MIN; n <= NOTE_MAX; n++) {
        if (!state.playbackLEDs.has(n) && !state.liveNotes.has(n)) sendLED(n, 0);
    }
}

// ===== TRACK ACTIONS =====
function toggleMute(idx) { state.tracks[idx].muted = !state.tracks[idx].muted; updateTrackUI(); }
function toggleSolo(idx) { state.tracks[idx].solo = !state.tracks[idx].solo; updateTrackUI(); }
function eraseTrack(idx) {
    state.tracks[idx].undoNotes = [...state.tracks[idx].notes];
    state.tracks[idx].notes = [];
    if (state.recordingTrack === idx) stopRecording();
    updateTrackUI();
}
function undoLast() {
    const t = state.tracks[state.selectedTrack];
    if (t.undoNotes !== null) {
        const cur = [...t.notes];
        t.notes = t.undoNotes;
        t.undoNotes = cur;
        updateTrackUI();
    }
}
function setTrackVolume(idx, val) {
    state.tracks[idx].volume = val;
    if (trackGainNodes[idx]) trackGainNodes[idx].gain.value = val;
}
function selectTrack(idx) {
    state.selectedTrack = idx;
    updateTrackUI();
}

// ===== CONTROLS =====
function setBPM(val) {
    state.bpm = parseInt(val);
    document.getElementById('bpmVal').textContent = val;
    if (state.playing) {
        const beat = getCurrentBeat();
        state.startTime = audioCtx.currentTime - beat * 60 / state.bpm;
    }
}

function setLoopBars(bars, btn) {
    state.loopBars = bars;
    document.querySelectorAll('#loopBtns .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildBeatIndicator();
    updateStatusBar();
}

function setQuantize(val, btn) {
    state.quantize = val;
    document.querySelectorAll('#quantBtns .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function toggleMetro() {
    state.metronome = !state.metronome;
    document.getElementById('metroBtn').classList.toggle('active', state.metronome);
}

// ===== BUILD UI =====
function buildTracks() {
    const c = document.getElementById('tracksContainer');
    c.innerHTML = '';
    for (let i = 0; i < 4; i++) {
        const lane = document.createElement('div');
        lane.className = 'track-lane';
        lane.id = `track-${i}`;
        lane.style.setProperty('--track-color', TRACK_COLORS[i]);
        lane.onclick = e => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            selectTrack(i);
        };
        lane.innerHTML = `
            <div class="track-info">
                <div class="track-color-dot" style="background:${TRACK_COLORS[i]};--track-color:${TRACK_COLORS[i]}"></div>
                <div class="track-name" style="color:${TRACK_COLORS[i]}">${TRACK_NAMES[i]}</div>
                <div class="track-note-count" id="noteCount${i}">0 notes</div>
            </div>
            <div class="track-canvas-wrap">
                <canvas id="trackCanvas${i}" width="800" height="56"></canvas>
            </div>
            <div class="track-controls">
                <button class="btn rec-btn" id="recBtn${i}" onclick="toggleRecording(${i})">REC</button>
                <button class="btn mute-btn" id="muteBtn${i}" onclick="toggleMute(${i})">M</button>
                <button class="btn solo-btn" id="soloBtn${i}" onclick="toggleSolo(${i})">S</button>
                <button class="btn erase-btn" onclick="eraseTrack(${i})">DEL</button>
                <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="0.7"
                       oninput="setTrackVolume(${i}, parseFloat(this.value))" title="Volume">
            </div>
        `;
        c.appendChild(lane);
    }
}

function buildBeatIndicator() {
    const c = document.getElementById('beatIndicator');
    c.innerHTML = '';
    const total = state.loopBars * 4;
    for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'beat-dot';
        d.id = `beat-${i}`;
        c.appendChild(d);
    }
}

function buildKeyboard() {
    const kb = document.getElementById('keyboard');
    kb.innerHTML = '';
    const isBlack = [0,1,0,1,0,0,1,0,1,0,1,0];
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const whites = [], blacks = [];
    for (let n = NOTE_MIN; n <= NOTE_MAX; n++) {
        if (isBlack[(n - NOTE_MIN) % 12]) blacks.push(n); else whites.push(n);
    }
    const ww = 100 / whites.length;

    // White keys
    whites.forEach((n, i) => {
        const k = document.createElement('div');
        k.className = 'white-key'; k.id = `key-${n}`;
        k.style.width = ww + '%';
        const pc = (n - NOTE_MIN) % 12;
        const oct = Math.floor(n / 12) - 1;
        k.innerHTML = `<span class="key-label">${names[pc]}${oct}</span>`;
        k.onmousedown = e => { e.preventDefault(); noteOn(n, 80); };
        k.onmouseup = () => noteOff(n);
        k.onmouseleave = () => { if (state.liveNotes.has(n)) noteOff(n); };
        kb.appendChild(k);
    });

    // Black keys
    blacks.forEach(n => {
        const k = document.createElement('div');
        k.className = 'black-key'; k.id = `key-${n}`;
        let wi = 0;
        for (let w = 0; w < whites.length; w++) { if (whites[w] < n) wi = w; }
        k.style.left = (wi + 0.62) * ww + '%';
        k.style.width = ww * 0.62 + '%';
        k.onmousedown = e => { e.preventDefault(); noteOn(n, 80); };
        k.onmouseup = () => noteOff(n);
        k.onmouseleave = () => { if (state.liveNotes.has(n)) noteOff(n); };
        kb.appendChild(k);
    });
}

function highlightKey(note, on, color) {
    const el = document.getElementById(`key-${note}`);
    if (!el) return;
    if (on) {
        el.style.background = color || '#888';
        el.classList.add('pressed');
    } else {
        el.style.background = '';
        el.classList.remove('pressed');
    }
}

// ===== UI UPDATES =====
function updateTrackUI() {
    for (let i = 0; i < 4; i++) {
        const lane = document.getElementById(`track-${i}`);
        const t = state.tracks[i];
        lane.classList.toggle('recording', state.recordingTrack === i);
        lane.classList.toggle('selected', state.selectedTrack === i);
        document.getElementById(`recBtn${i}`).classList.toggle('active', state.recordingTrack === i);
        document.getElementById(`muteBtn${i}`).classList.toggle('active', t.muted);
        document.getElementById(`soloBtn${i}`).classList.toggle('active', t.solo);
        document.getElementById(`noteCount${i}`).textContent = t.notes.length + ' note' + (t.notes.length !== 1 ? 's' : '');
    }
    // Keyboard track indicator
    const kbl = document.getElementById('kbTrackLabel');
    kbl.textContent = TRACK_NAMES[state.selectedTrack];
    kbl.style.background = TRACK_COLORS_DIM[state.selectedTrack];
    kbl.style.color = TRACK_COLORS[state.selectedTrack];

    updateStatusBar();
}

function updateStatusBar() {
    const loopLen = state.loopBars * 4;
    document.getElementById('statusLoop').textContent = `Loop: ${state.loopBars} bar${state.loopBars > 1 ? 's' : ''} (${loopLen} beats)`;
    const total = state.tracks.reduce((s, t) => s + t.notes.length, 0);
    document.getElementById('statusNotes').textContent = `Total notes: ${total}`;
    if (state.recordingTrack >= 0) {
        const tn = TRACK_NAMES[state.recordingTrack];
        document.getElementById('statusRec').textContent = state.recWaitingForBar ? `Waiting... (${tn})` : `REC: ${tn}`;
        document.getElementById('statusRec').style.color = TRACK_COLORS[state.recordingTrack];
    } else {
        document.getElementById('statusRec').textContent = 'Ready';
        document.getElementById('statusRec').style.color = '#444';
    }
}

// ===== RENDER LOOP (canvas) =====
function renderFrame() {
    const loopLen = state.loopBars * 4;
    const loopBeat = state.playing ? getLoopBeat() : 0;
    const curBeat = state.playing ? getCurrentBeat() : 0;

    // --- Track canvases ---
    for (let i = 0; i < 4; i++) {
        const canvas = document.getElementById(`trackCanvas${i}`);
        if (!canvas) continue;
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Background
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, 0, W, H);

        // Grid: bar lines
        for (let b = 0; b <= loopLen; b++) {
            const x = (b / loopLen) * W;
            const isBar = b % 4 === 0;
            ctx.strokeStyle = isBar ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.05)';
            ctx.lineWidth = isBar ? 1.2 : 0.6;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }

        // Sub-grid
        if (state.quantize < 1) {
            for (let b = 0; b < loopLen; b += state.quantize) {
                if (Number.isInteger(b)) continue;
                const x = (b / loopLen) * W;
                ctx.strokeStyle = 'rgba(255,255,255,0.025)';
                ctx.lineWidth = 0.5;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
        }

        // Note blocks (piano-roll style)
        const track = state.tracks[i];
        const color = TRACK_COLORS[i];
        for (const n of track.notes) {
            const x = (n.time / loopLen) * W;
            const w = Math.max((n.duration / loopLen) * W, 3);
            const yNorm = 1 - (n.note - NOTE_MIN) / NOTE_RANGE;
            const y = yNorm * (H - 6) + 1;
            const h = Math.max(3, H / NOTE_RANGE * 1.4);
            const vel01 = n.velocity / 127;

            // Note body with rounded corners
            ctx.globalAlpha = 0.55 + vel01 * 0.45;
            ctx.fillStyle = color;
            const r = Math.min(2, w / 2, h / 2);
            roundRect(ctx, x, y, w, h, r);
            ctx.fill();

            // Top highlight
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(x + 1, y, w - 2, 1);
            ctx.globalAlpha = 1;
        }

        // Playback head
        if (state.playing) {
            const hx = (loopBeat / loopLen) * W;
            // Glow trail
            const grad = ctx.createLinearGradient(hx - 12, 0, hx + 4, 0);
            grad.addColorStop(0, 'rgba(255,255,255,0)');
            grad.addColorStop(0.7, 'rgba(255,255,255,0.06)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(hx - 12, 0, 16, H);

            // Head line
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(hx, 0); ctx.lineTo(hx, H); ctx.stroke();

            // Head dot
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(hx, 0, 3, 0, Math.PI * 2); ctx.fill();
        }

        // Recording border
        if (state.recordingTrack === i) {
            const alpha = 0.4 + 0.4 * Math.sin(Date.now() / 180);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = alpha;
            ctx.strokeRect(1, 1, W - 2, H - 2);
            ctx.globalAlpha = 1;

            // "REC" or "WAITING" text
            if (state.recWaitingForBar) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('WAITING...', W / 2, H / 2 + 4);
                ctx.textAlign = 'start';
            }
        }

        // Empty hint
        if (track.notes.length === 0 && state.recordingTrack !== i) {
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('Press REC to record', W / 2, H / 2 + 4);
            ctx.textAlign = 'start';
        }

        // Muted overlay
        if (track.muted) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = 'bold 12px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('MUTED', W / 2, H / 2 + 4);
            ctx.textAlign = 'start';
        }
    }

    // --- Waveform displays ---
    for (let i = 0; i < 4; i++) {
        const canvas = document.getElementById(`wfCanvas${i}`);
        if (!canvas) continue;
        // Resize canvas to actual size
        if (canvas.width !== canvas.parentElement.clientWidth) {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        if (analyserNodes[i] && state.playing && !state.tracks[i].muted) {
            const bufLen = analyserNodes[i].frequencyBinCount;
            const data = new Uint8Array(bufLen);
            analyserNodes[i].getByteTimeDomainData(data);

            ctx.strokeStyle = TRACK_COLORS[i];
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            const sliceW = W / bufLen;
            for (let j = 0; j < bufLen; j++) {
                const v = data[j] / 128.0;
                const y = (v * H) / 2;
                j === 0 ? ctx.moveTo(0, y) : ctx.lineTo(j * sliceW, y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
        } else {
            // Flat line
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(W, canvas.height / 2);
            ctx.stroke();
        }
    }

    // --- Beat indicator dots ---
    if (state.playing) {
        const totalBeats = state.loopBars * 4;
        const beatIdx = Math.floor(loopBeat) % totalBeats;
        for (let i = 0; i < totalBeats; i++) {
            const dot = document.getElementById(`beat-${i}`);
            if (!dot) continue;
            dot.className = 'beat-dot';
            if (i === beatIdx) {
                dot.classList.add(i % 4 === 0 ? 'on-bar' : 'on-beat');
            }
        }
    } else {
        // Clear beat dots
        const totalBeats = state.loopBars * 4;
        for (let i = 0; i < totalBeats; i++) {
            const dot = document.getElementById(`beat-${i}`);
            if (dot) dot.className = 'beat-dot';
        }
    }

    // --- Position display ---
    if (state.playing) {
        const loopBt = getLoopBeat();
        const bar = Math.floor(loopBt / 4) + 1;
        const beat = Math.floor(loopBt % 4) + 1;
        document.getElementById('statusPos').textContent = `Bar ${bar} : Beat ${beat}`;
    } else {
        document.getElementById('statusPos').textContent = 'Bar 1 : Beat 1';
    }

    // Update note counts
    for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`noteCount${i}`);
        if (el) {
            const cnt = state.tracks[i].notes.length;
            el.textContent = cnt + ' note' + (cnt !== 1 ? 's' : '');
        }
    }

    // Update status
    const total = state.tracks.reduce((s, t) => s + t.notes.length, 0);
    document.getElementById('statusNotes').textContent = `Total notes: ${total}`;

    requestAnimationFrame(renderFrame);
}

// Rounded rect helper
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', e => {
    if (e.repeat) return;
    // Don't capture if user is in an input
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.code) {
        case 'Space':
            e.preventDefault();
            togglePlay();
            break;
        case 'Digit1': selectTrack(0); break;
        case 'Digit2': selectTrack(1); break;
        case 'Digit3': selectTrack(2); break;
        case 'Digit4': selectTrack(3); break;
        case 'KeyR': toggleRecording(state.selectedTrack); break;
        case 'KeyM': toggleMute(state.selectedTrack); break;
        case 'KeyS': toggleSolo(state.selectedTrack); break;
        case 'KeyE': eraseTrack(state.selectedTrack); break;
        case 'KeyZ': undoLast(); break;
        case 'Escape': stopPlayback(); break;
    }
});

// Touch support for keyboard
document.addEventListener('touchstart', e => {
    const el = e.target;
    if (el.classList.contains('white-key') || el.classList.contains('black-key')) {
        e.preventDefault();
        const note = parseInt(el.id.replace('key-', ''));
        if (!isNaN(note)) noteOn(note, 80);
    }
}, { passive: false });

document.addEventListener('touchend', e => {
    const el = e.target;
    if (el.classList.contains('white-key') || el.classList.contains('black-key')) {
        const note = parseInt(el.id.replace('key-', ''));
        if (!isNaN(note)) noteOff(note);
    }
});

// ===== INIT =====
function init() {
    buildTracks();
    buildBeatIndicator();
    buildKeyboard();
    updateTrackUI();
    updateStatusBar();
    renderFrame();
    initMIDI();
}

init();
</script>
